name: Check harness

on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Validate skills
        run: python3 scripts/check.py
      - name: Test maintenance scripts
        run: python3 -m unittest discover -s scripts/tests
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
      - name: Install pinned CLI for compatibility testing
        run: npm ci --ignore-scripts
      - name: Verify installation and version upgrades in temporary projects
        run: npm run test:skills
