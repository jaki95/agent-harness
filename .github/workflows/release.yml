name: Release harness

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths: [CHANGELOG.md]
  workflow_dispatch:
    inputs:
      version:
        description: 'Retry a prepared version on main, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  select:
    if: github.event.deleted != true && (github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.changelog.outputs.version }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: changelog
        name: Check the proposed changelog version
        env:
          BEFORE: ${{ github.event.pull_request.base.sha || github.event.before }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            python3 scripts/check_release.py "$REQUESTED_VERSION"
            echo "version=$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          previous="$RUNNER_TEMP/previous-changelog.md"
          : > "$previous"
          if [[ ! "$BEFORE" =~ ^0+$ ]]; then
            entry=$(git ls-tree "$BEFORE" -- CHANGELOG.md)
            if [[ -n "$entry" ]]; then
              git show "$BEFORE:CHANGELOG.md" > "$previous"
            fi
          fi
          version=$(python3 scripts/check_release.py --new-since "$previous")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  check:
    needs: select
    if: github.ref == 'refs/heads/main' && needs.select.outputs.version != ''
    uses: ./.github/workflows/check.yml

  statechart:
    needs: select
    if: github.ref == 'refs/heads/main' && needs.select.outputs.version != ''
    uses: ./.github/workflows/statechart.yml

  release:
    needs: [select, check, statechart]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    concurrency:
      group: harness-release-${{ needs.select.outputs.version }}
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - name: Validate and publish the checked revision
        env:
          RELEASE_VERSION: ${{ needs.select.outputs.version }}
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          python3 scripts/check_release.py "$RELEASE_VERSION" --notes-file "$notes"
          bash scripts/publish_release.sh "$RELEASE_VERSION" "$GITHUB_SHA" "$notes"
