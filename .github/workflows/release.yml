name: Release harness

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'New release tag, e.g. v0.1.0'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: harness-release
  cancel-in-progress: false

jobs:
  check:
    uses: ./.github/workflows/check.yml
  release:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Require main
        run: |
          if [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Releases must run from main.' >&2
            exit 1
          fi
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Validate release version and content
        run: python3 scripts/check_release.py "$RELEASE_VERSION"
      - name: Create new tag and GitHub release
        run: |
          if [ -n "$(git tag --list "$RELEASE_VERSION")" ]; then
            echo 'This release tag already exists; choose a new version.' >&2
            exit 1
          fi
          git tag "$RELEASE_VERSION" "$GITHUB_SHA"
          git push origin "refs/tags/$RELEASE_VERSION"
          gh release create "$RELEASE_VERSION" --verify-tag \
            --title "$RELEASE_VERSION" --generate-notes --latest
