name: Monitor upstream skills

on:
  schedule:
    - cron: '17 8 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths: [registry/skills.json]

permissions:
  contents: read

concurrency:
  group: upstream-skill-monitor
  cancel-in-progress: false

jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      issue: ${{ steps.monitor.outputs.issue }}
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Detect changes and maintain the current issue batch
        id: monitor
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_OPERATOR_REPO: ${{ vars.UPSTREAM_OPERATOR_REPO }}
          UPSTREAM_MONITOR_LOGIN: ${{ vars.UPSTREAM_MONITOR_LOGIN }}
        run: python3 scripts/monitor_upstream.py --output-dir work/upstream-report --issue-repo "$GITHUB_REPOSITORY"
      - name: Preserve the review report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: upstream-skill-report
          path: work/upstream-report/
          retention-days: 30
          if-no-files-found: warn
      - name: Fail when detection or publication failed
        if: always() && steps.monitor.outcome == 'failure'
        run: exit 1

  wake:
    needs: monitor
    if: ${{ always() && needs.monitor.outputs.issue != '' && vars.UPSTREAM_OPERATOR_REPO != '' }}
    uses: ./.github/workflows/dispatch-upstream-adoption.yml
    with:
      issue: ${{ needs.monitor.outputs.issue }}
    secrets:
      UPSTREAM_DISPATCH_PRIVATE_KEY: ${{ secrets.UPSTREAM_DISPATCH_PRIVATE_KEY }}
